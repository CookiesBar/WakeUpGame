# iOS production build on GitHub's Mac (no EAS build credits), then upload to TestFlight.
# Run: gh workflow run ios-build.yml
name: iOS build to TestFlight

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # .env is not in git; recreate it so PostHog is baked into the build
      - run: echo "EXPO_PUBLIC_POSTHOG_KEY=${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}" > .env

      - run: eas build --platform ios --profile production --local --non-interactive --output build.ipa

      - run: eas submit --platform ios --profile production --path build.ipa --non-interactive
